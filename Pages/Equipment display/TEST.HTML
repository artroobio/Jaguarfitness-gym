<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jaguar Fitness - Cardio Series</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@300;400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --bg-body: #000000;
            --bg-card: #1a1a1a;
            --accent-orange: #f27f3d;
            --accent-glow: rgba(242, 127, 61, 0.6);
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --font-heading: 'Oswald', sans-serif;
            --font-body: 'Roboto', sans-serif;
            --font-tech: 'Share Tech Mono', monospace;
            --transition-speed: 1s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-body); 
            font-family: var(--font-body);
            color: var(--text-main);
            overflow-x: hidden; /* Prevent horizontal scroll only */
            overflow-y: auto;   /* Allow vertical scroll */
            scroll-behavior: smooth; /* Native smooth scrolling */
        }

        /* --- GLOBAL BACKGROUND (Fixed) --- */
        .bg-animate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            /* Spotlight centered left */
            background: radial-gradient(circle at 30% 50%, #2b2b2b 0%, #000000 85%);
        }

        /* --- HEADER (Fixed Top) --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px 60px;
            z-index: 2000;
            pointer-events: none;
            display: flex;
            justify-content: flex-start;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            margin: 0;
        }

        .accent { color: var(--accent-orange); }

        /* --- SECTION 1: KINETIC INTRO --- */
        .intro-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-color: #050505;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr 1fr; /* Text Left, Image Right */
            align-items: center;
            overflow: hidden;
            border-bottom: 2px solid var(--accent-orange);
        }

        /* Left Column: Content */
        .intro-content-wrapper {
            padding: 0 0 0 10%;
            z-index: 10;
            display: flex;
            justify-content: center;
            flex-direction: column;
        }

        .intro-content {
            position: relative;
            text-align: left;
            /* Removed HUD styling for cleaner Kinetic look */
            max-width: 800px;
        }

        /* KINETIC TYPOGRAPHY STYLES */
        .kinetic-text {
            font-family: var(--font-heading);
            font-size: 5.5rem; /* Adjusted for split screen */
            line-height: 0.9;
            text-transform: uppercase;
            text-align: left;
            color: transparent;
            -webkit-text-stroke: 2px rgba(255, 255, 255, 0.3);
            position: relative;
            margin-bottom: 40px;
        }

        .kinetic-text span {
            display: block;
            position: relative;
            overflow: hidden;
        }

        /* Fill Animation */
        .kinetic-text span::before {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            color: #fff;
            -webkit-text-stroke: 0px;
            overflow: hidden;
            border-right: 4px solid var(--accent-orange);
            animation: textFill 1.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        .kinetic-text span:nth-child(1)::before { animation-delay: 0.2s; }
        .kinetic-text span:nth-child(2)::before { animation-delay: 0.8s; color: var(--accent-orange); }

        @keyframes textFill {
            0% { width: 0%; }
            100% { width: 100%; border-right-color: transparent; }
        }

        .intro-eyebrow {
            font-family: var(--font-tech);
            font-size: 1rem;
            color: #fff;
            letter-spacing: 4px;
            margin-bottom: 20px;
            display: block;
            opacity: 0.8;
            text-transform: uppercase;
        }

        .intro-cta {
            background: transparent;
            border: 1px solid var(--accent-orange);
            color: var(--accent-orange);
            padding: 18px 50px;
            font-family: var(--font-heading);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 20px;
            display: inline-block;
        }

        .intro-cta:hover {
            background: var(--accent-orange);
            color: #000;
            box-shadow: 0 0 30px var(--accent-glow);
        }

        /* Right Column: Big Image */
        .intro-image-wrapper {
            z-index: 5;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* NEW: Visual Group for Image + Hotspots */
        .intro-visual-group {
            position: relative;
            max-width: 120%;
            height: auto;
            max-height: 90vh;
            /* Flip the container horizontally to face content */
            transform: scaleX(-1) translateX(10%);
            transition: transform 0.5s ease;
        }

        .intro-product-img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 50px rgba(0,0,0,0.8));
        }
        
        .intro-image-wrapper:hover .intro-visual-group {
            /* Hover effect applies to group */
            transform: scaleX(-1) translateX(10%) scale(1.02);
        }

        /* HOTSPOTS */
        .intro-hotspot {
            position: absolute;
            width: 24px;
            height: 24px;
            background: rgba(242, 127, 61, 0.2);
            border: 2px solid var(--accent-orange);
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .intro-hotspot::before {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--accent-orange);
            border-radius: 50%;
        }

        .intro-hotspot::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 1px solid var(--accent-orange);
            animation: pulse-hotspot 2s infinite;
        }

        @keyframes pulse-hotspot {
            0% { width: 100%; height: 100%; opacity: 1; }
            100% { width: 300%; height: 300%; opacity: 0; }
        }

        /* HOTSPOT TOOLTIP */
        .hotspot-tooltip {
            position: absolute;
            bottom: 40px;
            left: 50%;
            /* Important: Flip text back because container is flipped! */
            transform: translateX(-50%) scaleX(-1); 
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid var(--accent-orange);
            padding: 15px;
            width: 220px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: left;
        }

        .hotspot-tooltip h4 {
            color: var(--accent-orange);
            font-family: var(--font-heading);
            font-size: 1rem;
            margin: 0 0 5px 0;
            text-transform: uppercase;
        }

        .hotspot-tooltip p {
            color: #ccc;
            font-family: var(--font-tech);
            font-size: 0.8rem;
            margin: 0;
            line-height: 1.4;
        }

        .intro-hotspot:hover .hotspot-tooltip {
            opacity: 1;
            bottom: 50px; /* Slight rise animation */
        }

        /* --- SECTION 2: CAROUSEL (Main) --- */
        main {
            display: flex;
            width: 100%;
            height: 100vh; /* Takes full viewport height */
            position: relative;
            perspective: 2500px; 
            overflow: hidden; /* Clip 3D content */
        }

        /* --- 3D CYLINDER STAGE (Left Side) --- */
        .carousel-stage {
            width: 60%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Changed to pan-y to allow vertical page scroll */
            touch-action: pan-y; 
        }

        .carousel-track {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform var(--transition-speed) cubic-bezier(0.19, 1, 0.22, 1);
        }

        /* THE CARD */
        .card {
            position: absolute;
            width: 420px; 
            height: 600px;
            left: 50%;
            top: 50%;
            margin-left: -210px;
            margin-top: -300px;
            background: transparent; 
            border: none; 
            border-radius: 12px;
            cursor: pointer;
            overflow: visible; 
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: visible; 
            transition: transform 0.4s; 
        }

        .card img {
            width: 100%; 
            height: 100%; 
            object-fit: contain;
            pointer-events: none;
            filter: brightness(0.4) grayscale(1) drop-shadow(0 10px 20px rgba(0,0,0,0.8)); 
            transition: filter 0.8s, transform 0.4s;
        }

        .card.active { z-index: 50; }

        .card.active img {
            filter: brightness(1) grayscale(0) drop-shadow(0 0 30px var(--accent-glow));
            transform: scale(1.1);
        }

        /* --- RIGHT SIDE SPEC PANEL --- */
        .hud-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 40%;
            height: 100%;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 2px solid var(--accent-orange);
            box-shadow: -20px 0 50px rgba(0,0,0,0.5);
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            padding: 120px 60px 60px 60px; 
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .hud-panel.hidden { transform: translateX(100%); }
        .hud-panel.visible { transform: translateX(0); }

        .hud-header-section { width: 100%; margin-bottom: 20px; }
        .hud-title { font-family: var(--font-heading); font-size: 3.5rem; color: #fff; margin: 0 0 10px 0; line-height: 1; text-transform: uppercase; }
        .hud-subtitle { color: var(--accent-orange); font-size: 1.1rem; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; display: block; margin-bottom: 20px; }

        .tabs-nav { display: flex; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px; }
        .tab-btn { background: transparent; border: none; color: var(--text-muted); font-family: var(--font-heading); font-size: 1.2rem; text-transform: uppercase; padding: 10px 20px 10px 0; cursor: pointer; transition: all 0.3s ease; letter-spacing: 1px; position: relative; }
        .tab-btn:hover { color: #fff; }
        .tab-btn.active { color: var(--accent-orange); font-weight: 700; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 40px; height: 3px; background: var(--accent-orange); }

        .tab-pane { display: none; animation: fadeIn 0.5s ease forwards; }
        .tab-pane.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .hud-desc { font-size: 1.1rem; line-height: 1.8; color: var(--text-muted); margin-bottom: 20px; }
        .feature-list { list-style: none; padding: 0; }
        .feature-list li { position: relative; padding-left: 20px; margin-bottom: 12px; color: #e0e0e0; font-size: 1rem; }
        .feature-list li::before { content: '▹'; color: var(--accent-orange); position: absolute; left: 0; }

        .spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 10px; }
        .spec-item { display: flex; flex-direction: column; border-left: 2px solid rgba(255,255,255,0.1); padding-left: 15px; }
        .spec-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 5px; }
        .spec-value { font-family: var(--font-heading); font-size: 1.4rem; color: #fff; }

        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 60px; height: 60px; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; z-index: 300; display: flex; align-items: center; justify-content: center; color: #fff; transition: all 0.3s; }
        .nav-btn:hover { background: var(--accent-orange); border-color: var(--accent-orange); transform: translateY(-50%) scale(1.1); }
        .nav-prev { left: 50px; }
        .nav-next { left: 52%; }

        /* --- MOBILE RESPONSIVE --- */
        @media (max-width: 900px) {
            
            /* Header */
            header { padding: 20px; justify-content: center; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
            h1 { font-size: 1.5rem; }

            /* Intro */
            .intro-section { 
                grid-template-columns: 1fr; 
                grid-template-rows: 1fr 1fr;
                padding-top: 80px; 
            }
            .intro-content-wrapper { padding: 0 20px; align-items: center; }
            .intro-content { width: 100%; text-align: center; }
            .kinetic-text { font-size: 15vw; text-align: center; } /* Resize Kinetic Text for Mobile */
            
            .intro-image-wrapper { align-items: flex-start; }
            /* Reset transform for mobile so dots align more predictably without complex math */
            .intro-visual-group { transform: none; width: 100%; display: flex; justify-content: center; }
            .intro-product-img { max-width: 90%; max-height: 40vh; }
            
            /* Disable hover zoom on mobile to prevent layout shifts */
            .intro-image-wrapper:hover .intro-visual-group { transform: none; }
            
            /* Adjust Tooltip flip for mobile (since we removed container flip) */
            .hotspot-tooltip { transform: translateX(-50%) scaleX(1); width: 180px; }

            /* Carousel Layout */
            main { flex-direction: column; height: 100vh; } 
            .bg-animate { background: radial-gradient(circle at 50% 30%, #2b2b2b 0%, #000000 70%); }
            
            .carousel-stage { width: 100%; height: 50%; top: 0; perspective: 1000px; z-index: 10; }
            .card { width: 240px; height: 340px; margin-left: -120px; margin-top: -170px; }
            
            .nav-prev { left: 10px; top: 50%; width: 50px; height: 50px; }
            .nav-next { right: 10px; left: auto; top: 50%; width: 50px; height: 50px; }

            .hud-panel { width: 100%; height: 50%; top: auto; bottom: 0; border-left: none; border-top: 2px solid var(--accent-orange); padding: 25px; justify-content: flex-start; overflow-y: auto; touch-action: pan-y; }
            
            .hud-title { font-size: 2rem; margin-bottom: 5px; }
            .hud-subtitle { font-size: 0.9rem; margin-bottom: 15px; }
            .hud-desc { font-size: 0.9rem; line-height: 1.5; margin-bottom: 15px; }
            .spec-grid { gap: 15px; grid-template-columns: 1fr 1fr; }
            .spec-value { font-size: 1.1rem; }
            .tabs-nav { margin-bottom: 15px; }
            .tab-btn { font-size: 1rem; padding: 5px 15px 5px 0; }
        }
    </style>
</head>

                    "Ergonomic knurled chrome handles",
                    "Impact-absorbing virgin rubber",
                    "Pinned heads for durability"
                ],
                specs: [
                    { label: "Core", val: "Cast Iron" },
                    { label: "Coating", val: "Virgin Rubber" },
                    { label: "Handle", val: "Chrome" },
                    { label: "Increments", val: "5-100 lbs" }
                ],
                image: "https://www.dropbox.com/scl/fi/rsafvkjat5ekioez04ipw/2151114151.png?rlkey=tfhwbwfup8p90lwvzpofjyyft&st=gywbb87c&raw=1" 
            }
        ];

        // --- EXPAND DATA ---
        const products = [...baseProducts, ...baseProducts, ...baseProducts];

        // --- STATE ---
        let currentIndex = 0;
        const track = document.getElementById('track');
        const infoPanel = document.getElementById('info-panel');
        const totalItems = products.length;
        
        // --- 3D CONFIGURATION ---
        const cardWidth = 420; 
        const gap = 20; 
        
        // Dynamic Radius Calculation:
        const radius = Math.round( ((cardWidth + gap) / 2) / Math.tan(Math.PI / totalItems) );
        const theta = 360 / totalItems; 

        // --- INTRO SCROLL LOGIC ---
        function scrollToCarousel() {
            document.getElementById('carousel-section').scrollIntoView({ behavior: 'smooth' });
        }

        // --- INIT ---
        function initCarousel() {
            track.innerHTML = '';
            
            products.forEach((prod, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = index;
                card.onclick = () => jumpTo(index);

                // Initial 3D Position
                const angle = theta * index;
                card.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;

                const img = document.createElement('img');
                img.src = prod.image;
                img.alt = prod.title;
                
                card.appendChild(img);
                track.appendChild(card);
            });

            updateView();
            updatePanelContent(); 
        }

        // --- CAROUSEL LOGIC ---
        function updateView() {
            const currentAngle = currentIndex * -theta;
            track.style.transform = `translateZ(-${radius}px) rotateY(${currentAngle}deg)`;

            let normalizedIndex = currentIndex % totalItems;
            if (normalizedIndex < 0) normalizedIndex += totalItems;

            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                if (parseInt(card.dataset.index) === normalizedIndex) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });
        }

        function rotateCarousel(direction) {
            currentIndex += direction;
            updateView();
            animatePanelUpdate();
        }

        function jumpTo(targetIndex) {
            let currentMod = currentIndex % totalItems;
            if (currentMod < 0) currentMod += totalItems;
            
            let diff = targetIndex - currentMod;
            
            if (diff > totalItems / 2) diff -= totalItems;
            if (diff < -totalItems / 2) diff += totalItems;

            currentIndex += diff;
            updateView();
            animatePanelUpdate();
        }

        // --- INFO PANEL LOGIC ---
        function updatePanelContent() {
            let normalizedIndex = currentIndex % totalItems;
            if (normalizedIndex < 0) normalizedIndex += totalItems;
            
            const data = products[normalizedIndex];

            document.getElementById('p-title').textContent = data.title;
            document.getElementById('p-subtitle').textContent = data.subtitle;
            document.getElementById('p-desc').textContent = data.desc;

            const featureList = document.getElementById('p-features');
            featureList.innerHTML = '';
            data.features.forEach(feature => {
                const li = document.createElement('li');
                li.textContent = feature;
                featureList.appendChild(li);
            });

            const specContainer = document.getElementById('p-specs');
            specContainer.innerHTML = '';
            
            data.specs.forEach(s => {
                const item = document.createElement('div');
                item.className = 'spec-item';
                item.innerHTML = `
                    <span class="spec-label">${s.label}</span>
                    <span class="spec-value">${s.val}</span>
                `;
                specContainer.appendChild(item);
            });
        }

        function animatePanelUpdate() {
            infoPanel.classList.remove('visible');
            infoPanel.classList.add('hidden');

            setTimeout(() => {
                updatePanelContent();
                infoPanel.classList.remove('hidden');
                infoPanel.classList.add('visible');
            }, 600);
        }

        // --- TAB LOGIC ---
        function switchTab(tabName) {
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => {
                if (btn.textContent.toLowerCase().includes(tabName === 'features' ? 'features' : 'specifications')) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            const panes = document.querySelectorAll('.tab-pane');
            panes.forEach(pane => pane.classList.remove('active'));

            document.getElementById(`tab-${tabName}`).classList.add('active');
        }

        // --- KEYBOARD & TOUCH SUPPORT ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') rotateCarousel(-1);
            if (e.key === 'ArrowRight') rotateCarousel(1);
        });

        // Add Swipe Support
        let touchStartX = 0;
        let touchEndX = 0;
        const carouselStage = document.querySelector('.carousel-stage');

        carouselStage.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        carouselStage.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) rotateCarousel(1); 
            if (touchEndX > touchStartX + 50) rotateCarousel(-1); 
        }

        // Start
        initCarousel();

    </script>
</body>
</html>
